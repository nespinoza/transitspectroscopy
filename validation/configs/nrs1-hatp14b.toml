# NIRSpec/G395H NRS1 validation: HAT-P-14 b commissioning TSO (PID 1118, observation 5),
# first segment. Run from the repository root:
#   python validation/validate.py --config validation/configs/nrs1-hatp14b.toml
# The reduction itself is an ordinary run configuration (`transitspectroscopy run ...`).

[run]
name = "nrs1-hatp14b"
output = "validation/runs/nrs1-hatp14b"

[data]
source = "mast"
program = 1118
observation = 5
exposure = "jw01118005001_04101_00001"
segments = [1]
detectors = ["nrs1"]
product = "uncal"
folder = "validation/data"

[calibration]
# Context used by the reference run (validation/runs/nrs1_segment001_20260922_final).
crds_context = "jwst_1584.pmap"
use_tso_jump = true

[calibration.ramp_fit_parameters.ramp_fit]
maximum_cores = "1"

[extraction.simple]
aperture_radius = 2.0
mask_dq = true
scale_1f = true
single_trace_extraction = true
zero_nans = true

[extraction.polynomial]
aperture_radius = 2.0
mask_dq = true
scale_1f = true
single_trace_extraction = true
zero_nans = true
optimal_extraction = true
backend = "python"
polynomial_spacing = 1.0
polynomial_order = 3
nsigma = 10.0

[extraction.gp]
aperture_radius = 2.0
mask_dq = true
scale_1f = true
single_trace_extraction = true
zero_nans = true
optimal_extraction = true
backend = "python"
profile_method = "gp"
polynomial_spacing = 1.0
polynomial_order = 3
nsigma = 10.0
gp_options = { kernel = "matern32", length_scale = 100.0, amplitude = 1.0, n_inducing = 24 }

[validation]
kind = "nrs1"
pixels_xy = [[500, 5], [1000, 20], [1750, 15]]
fwhm_distance_from_trace = 7
trace_filter_points = 11
fwhm_filter_points = 21
white_light_filter_points = 100
spectrum_variant = "corrected"

[validation.plots]
cmap = "magma"
last_minus_first_limits_dn = [-100, 20000]
rate_limits_dn_per_second = [-10, 1500]
ramp_limits_dn = [-1000, 40000]
ramp_residual_limits_dn = [-150, 150]
asinh_width_dn = 100
asinh_width_dn_per_second = 10
dpi = 150
